// ───────────────────────────────────────────────────────────── utilidades
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eout = (t) => 1 - Math.pow(1 - clamp(t), 3);
const win = (t, a, b, fi = 0.5, fo = 0.5) => sm(a, a + fi, t) * (1 - sm(b - fo, b, t));
const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const rampOf = (stops) => { const s = stops.map(([p, h]) => [p, hex(h)]); return (v) => { v = clamp(v); for (let i = 1; i < s.length; i++) if (v <= s[i][0]) { const f = (v - s[i - 1][0]) / (s[i][0] - s[i - 1][0]); return s[i - 1][1].map((c, k) => lerp(c, s[i][1][k], f)); } return s[s.length - 1][1]; }; };
